# Dependency updates, built into GitHub: no third-party app gets access to the repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age before proposing it, as pnpm's own supply-chain policy does.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 (the native port) yet. Lift this
      # once it does.
      - dependency-name: typescript
        versions: [">=7"]
      # The Action runs on Node 24 (action.yml, esbuild target), so the types stay on 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
