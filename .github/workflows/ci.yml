name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # pnpm is not on PATH until Corepack is enabled in the next step.
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # So the test that compiles fixtures/sample-project runs instead of skipping. Pinned
      # to the version the adapter was built against. Installed with npm, not pnpm: the CLI
      # requires packages it does not declare, which pnpm's strict layout does not provide.
      # Pinned by version, not by a lockfile: Scorecard reads every lockfile, and this CLI's
      # own dependencies carry advisories it cannot fix (vm2), reported as this repo's.
      - name: Install the Dataform CLI
        run: npm install -g @dataform/cli@3.0.61 # zizmor: ignore[adhoc-packages]

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            git status --porcelain -- dist
            exit 1
          fi

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: zizmor
        run: pipx run zizmor==1.32.0 --persona regular --min-severity low .github/workflows
