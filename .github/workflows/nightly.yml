name: Nightly

# Catches drift we do not control: new Dataform CLI releases, whose output the adapter
# parses. (A live run against BigQuery is planned separately: #68.)
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cli-canary:
    name: Dataform CLI ${{ matrix.cli }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest 3.x we support (teams on core 3.0), and whatever 3.x is newest tonight.
        # CI tests 3.1.6 on every push.
        cli: ["3.0.61", "3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Deliberately unpinned: the point is to try the newest CLI before users do.
      - name: Install Dataform CLI ${{ matrix.cli }}
        env:
          CLI_VERSION: ${{ matrix.cli }}
        run: npm install --prefix "$RUNNER_TEMP/cli" "@dataform/cli@$CLI_VERSION" # zizmor: ignore[adhoc-packages]

      - name: Compile and parse the sample project with it
        run: |
          version=$(node -p "require('$RUNNER_TEMP/cli/node_modules/@dataform/cli/package.json').version")
          echo "Dataform CLI $version"
          # The 3.x CLI needs a core with the same major.minor.
          cp -R fixtures/sample-project "$RUNNER_TEMP/sample"
          sed -i "s/^dataformCoreVersion: .*/dataformCoreVersion: $version/" "$RUNNER_TEMP/sample/workflow_settings.yaml"
          export DATAFORM_SAMPLE_PROJECT="$RUNNER_TEMP/sample"
          export PATH="$RUNNER_TEMP/cli/node_modules/.bin:$PATH"
          node_modules/.bin/vitest run packages/dataform

  cli-v2:
    name: Dataform CLI 2.x
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --prefix fixtures/v2-project

      # The 2.x CLI is not a dependency of this repository; only this job uses it. Pinned by
      # version, not by a lockfile, for the same reason as in ci.yml.
      - name: Install Dataform CLI 2.9.0
        run: npm install --prefix "$RUNNER_TEMP/cli2" @dataform/cli@2.9.0 # zizmor: ignore[adhoc-packages]

      - name: Compile and parse a dataform.json project
        run: DATAFORM_V2_CLI="$RUNNER_TEMP/cli2/node_modules/.bin/dataform" node_modules/.bin/vitest run packages/dataform/test/compile.test.ts

  report:
    name: Open an issue when the nightly fails
    needs: [cli-canary, cli-v2]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly --title "Nightly run failed" --body "The nightly CLI canary failed: $RUN_URL"
          fi
