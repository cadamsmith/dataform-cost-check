name: Nightly

# Catches drift we do not control: new Dataform CLI releases (whose output the adapter
# parses), BigQuery's live API, and Google's on-demand list prices. Dry runs are free.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cli-canary:
    name: Dataform CLI ${{ matrix.cli }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest 3.x we support (teams on core 3.0), and whatever 3.x is newest tonight.
        # CI tests 3.1.6 on every push.
        cli: ["3.0.61", "3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Deliberately unpinned: the point is to try the newest CLI before users do.
      - name: Install Dataform CLI ${{ matrix.cli }}
        env:
          CLI_VERSION: ${{ matrix.cli }}
        run: npm install --prefix "$RUNNER_TEMP/cli" "@dataform/cli@$CLI_VERSION" # zizmor: ignore[adhoc-packages]

      - name: Compile and parse the sample project with it
        run: |
          version=$(node -p "require('$RUNNER_TEMP/cli/node_modules/@dataform/cli/package.json').version")
          echo "Dataform CLI $version"
          # The 3.x CLI needs a core with the same major.minor.
          cp -R fixtures/sample-project "$RUNNER_TEMP/sample"
          sed -i "s/^dataformCoreVersion: .*/dataformCoreVersion: $version/" "$RUNNER_TEMP/sample/workflow_settings.yaml"
          export DATAFORM_SAMPLE_PROJECT="$RUNNER_TEMP/sample"
          export PATH="$RUNNER_TEMP/cli/node_modules/.bin:$PATH"
          node_modules/.bin/vitest run packages/dataform

  cli-v2:
    name: Dataform CLI 2.x
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --prefix fixtures/v2-project

      # The 2.x CLI is not a dependency of this repository; only this job uses it. Pinned by
      # version, not by a lockfile, for the same reason as in ci.yml.
      - name: Install Dataform CLI 2.9.0
        run: npm install --prefix "$RUNNER_TEMP/cli2" @dataform/cli@2.9.0 # zizmor: ignore[adhoc-packages]

      - name: Compile and parse a dataform.json project
        run: DATAFORM_V2_CLI="$RUNNER_TEMP/cli2/node_modules/.bin/dataform" node_modules/.bin/vitest run packages/dataform/test/compile.test.ts packages/dataform/test/merge-template.test.ts

  live:
    name: Live run against BigQuery
    # Keyless sign-in to this tool's own test project (repository variables GCP_PROJECT,
    # GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT). The service account has BigQuery Job User
    # only: the demo reads public data. Skipped until the variables are set.
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install and build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the Dataform CLI
        run: npm install -g @dataform/cli@3.1.6 # zizmor: ignore[adhoc-packages]

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run the partition-filter demo with a $1 limit
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          git config --global user.name nightly
          git config --global user.email nightly@example.com
          examples/trends-demo/run.sh --project "$GCP_PROJECT" --limit 1 | tee "$RUNNER_TEMP/out.txt"
          # The demo drops a partition filter on a public table: the estimate must go over
          # the limit, name the cause, and fail the check.
          grep -qF "Over the \$1.00 limit" "$RUNNER_TEMP/out.txt"
          grep -q 'likely cause: a filter on the partitioned table' "$RUNNER_TEMP/out.txt"
          grep -q 'Check exit code: 1' "$RUNNER_TEMP/out.txt"

  price-drift:
    name: Built-in prices match Google's catalog
    # Compares ON_DEMAND_PRICE_PER_TIB with the Cloud Billing Catalog API (free, public
    # data, no role needed) and fails on any change, so the report job opens an issue.
    # Fixing it stays a manual edit. Same keyless sign-in as the live run.
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Compare prices
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/price-drift.mjs

  report:
    name: Open an issue when the nightly fails
    needs: [cli-canary, cli-v2, live, price-drift]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly --title "Nightly run failed" --body "The nightly CLI canary, live run or price-drift check failed: $RUN_URL"
          fi
