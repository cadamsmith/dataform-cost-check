name: Dataform Cost Check
description: Post a BigQuery cost estimate on every Dataform pull request.
author: cadamsmith
branding:
  icon: dollar-sign
  color: blue
inputs:
  config-path:
    description: Path to the config file, relative to the repository root.
    required: false
    default: dataform-cost-check.yml
  project-dir:
    description: Directory of the Dataform project (with workflow_settings.yaml), relative to the repository root.
    required: false
    default: "."
  project-id:
    description: Google Cloud project the dry-run jobs are created in. Defaults to the project google-github-actions/auth sets.
    required: false
    default: ""
  base-ref:
    description: Commit to compare against. Defaults to the pull request's base commit.
    required: false
    default: ""
  github-token:
    description: Token used to post the sticky pull request comment.
    required: false
    default: ${{ github.token }}
outputs:
  monthly-delta:
    description: Estimated change in monthly spend, in USD (negative for savings).
  over-limit:
    description: "'true' when the estimate exceeds the configured limit."
runs:
  using: node24
  main: dist/index.cjs
